<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyLifeSense</title>
    <meta name="description" content="Understand what drives the patterns in your life." />
    <meta name="theme-color" content="#7c6ce4" />
    <link rel="icon" href="/app/icon.png" />
    <link rel="apple-touch-icon" href="/app/icon.png" />
    <style>
      :root { --ink: #2a2648; --muted: #6b6690; --ground: #e9e8fb; --accent: #7c6ce4; --accent2: #a48bf0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 80% -10%, #d9d4fb 0%, transparent 60%),
          radial-gradient(900px 500px at -10% 110%, #efe9ff 0%, transparent 55%),
          var(--ground);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { max-width: 560px; text-align: center; }
      .logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 18px 40px rgba(124,108,228,.35); }
      h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; margin: 20px 0 6px; }
      h1 .g { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0 auto 28px; max-width: 30rem; }
      .cta {
        display: inline-flex; align-items: center; gap: 8px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        color: #fff; text-decoration: none; font-weight: 700; font-size: 16px;
        padding: 14px 28px; border-radius: 14px; box-shadow: 0 12px 28px rgba(124,108,228,.4);
        transition: filter .15s ease;
      }
      .cta:hover { filter: brightness(1.06); }
      .note { margin-top: 18px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/app/icon.png" alt="MyLifeSense" />
      <h1>My<span class="g">LifeSense</span></h1>
      <p>Track the things you want to understand about yourself — and let the patterns surface.</p>
      <a class="cta" href="/app">Open the app →</a>
      <p class="note">The full website is on its way.</p>
    </main>
  </body>
</html>
